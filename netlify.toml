[build]
  publish = "app/static"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"
  DATABASE_URL = "sqlite+aiosqlite:///./gem_compliance.db"

# API routes redirected to Netlify Python serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/docs"
  to = "/.netlify/functions/api/docs"
  status = 200

[[redirects]]
  from = "/openapi.json"
  to = "/.netlify/functions/api/openapi.json"
  status = 200

# Web routes
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/login.html"
  status = 302
