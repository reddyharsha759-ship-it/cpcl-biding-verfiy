services:
  - type: web
    name: cpcl-gem-compliance-copilot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./gem_compliance.db
      - key: CORS_ORIGINS
        value: '["*"]'
